name: Lecture PDF

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube video URL"
        required: true
      start_min:
        description: "Kitne minute se shuru karna hai"
        default: "0"
      dur_min:
        description: "Kitne minute process karne hain"
        default: "20"
      height:
        description: "Max video height (720 recommended)"
        default: "720"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install python packages
        run: pip install -U "yt-dlp[default]" opencv-python-headless numpy img2pdf

      - name: Build PDF
        env:
          URL: ${{ inputs.url }}
          START_MIN: ${{ inputs.start_min }}
          DUR_MIN: ${{ inputs.dur_min }}
          HEIGHT: ${{ inputs.height }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: python lecture_pdf.py "$URL" "$START_MIN" "$DUR_MIN" "$HEIGHT"

      - name: Publish release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lecture-${{ github.run_number }}
          name: Lecture PDF #${{ github.run_number }}
          files: |
            out/lecture_slides.pdf
            out/report.txt
            out/scores.csv
